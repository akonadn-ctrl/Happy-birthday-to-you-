<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عيد ميلاد سعيد سمية ❤️</title>

<style>

/* =========================
   الإعدادات العامة
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050105;
    font-family:Arial,"Tahoma",sans-serif;
}

body{
    color:white;
}

/* =========================
   الخلفيات
========================= */

.screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

.hidden{
    display:none !important;
}

/* =========================
   الشاشة الأولى
========================= */

#startScreen{
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at 50% 50%,
        #641433 0%,
        #310a1d 35%,
        #12040c 70%,
        #030103 100%);
}

.startBox{
    position:relative;
    z-index:20;
    text-align:center;
    padding:30px;
}

.startTitle{
    font-size:clamp(30px,8vw,75px);
    font-weight:bold;
    margin-bottom:40px;

    text-shadow:
        0 0 10px #ff477e,
        0 0 30px #ff174f,
        0 0 70px #8b123f;

    animation:titleGlow 2s infinite alternate;
}

@keyframes titleGlow{
    from{
        text-shadow:
        0 0 10px #ff477e,
        0 0 25px #ff174f;
    }

    to{
        text-shadow:
        0 0 20px #fff,
        0 0 45px #ff174f,
        0 0 80px #8b123f;
    }
}

.startButton{
    border:2px solid #ff7196;
    color:white;

    background:
        linear-gradient(135deg,
        #57102b,
        #a51f4e);

    padding:18px 45px;

    border-radius:60px;

    font-size:clamp(20px,5vw,30px);

    cursor:pointer;

    box-shadow:
        0 0 15px #ff174f,
        0 0 40px #8b123f;

    animation:buttonPulse 1.7s infinite;
}

@keyframes buttonPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

/* =========================
   النجوم
========================= */

.star{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 6px white,
        0 0 15px #ffb6ce;

    animation:starTwinkle 2s infinite alternate;
}

@keyframes starTwinkle{

    from{
        opacity:.2;
        transform:scale(.6);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* =========================
   القمر
========================= */

.moon{
    position:absolute;

    top:7%;
    left:7%;

    width:80px;
    height:80px;

    border-radius:50%;

    background:#fff6d5;

    box-shadow:
        0 0 20px #fff,
        0 0 50px #fff1bd;
}

.moon:after{
    content:"";

    position:absolute;

    width:80px;
    height:80px;

    border-radius:50%;

    background:#15050d;

    top:-10px;
    left:25px;
}

/* =========================
   الورود
========================= */

.rose{
    position:absolute;

    font-size:clamp(25px,6vw,60px);

    filter:
        drop-shadow(0 0 7px #ff174f)
        drop-shadow(0 0 15px #8b123f);

    animation:roseFloat 4s ease-in-out infinite;
}

@keyframes roseFloat{

    0%,100%{
        transform:translateY(0) rotate(-5deg);
    }

    50%{
        transform:translateY(-20px) rotate(7deg);
    }
}

/* =========================
   القلوب الطائرة
========================= */

.floatingHeart{
    position:absolute;

    color:#ff315f;

    font-size:clamp(20px,5vw,45px);

    filter:
        drop-shadow(0 0 7px #ff174f)
        drop-shadow(0 0 15px #8b123f);

    animation:heartFly linear infinite;
}

@keyframes heartFly{

    0%{
        transform:translateY(110vh) scale(.4);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-20vh) scale(1.2) rotate(20deg);
        opacity:0;
    }
}

/* =========================
   المشاهد
========================= */

.scene{
    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
        radial-gradient(circle at center,
        #4b0d25 0%,
        #19050f 45%,
        #030103 100%);
}

.sceneContent{
    position:relative;

    z-index:20;

    text-align:center;

    padding:20px;
}

.title{
    font-size:clamp(38px,9vw,90px);

    font-weight:bold;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #ff477e,
        0 0 55px #ff174f,
        0 0 90px #8b123f;

    animation:titleAppear 1.5s ease;
}

.subtitle{
    margin-top:25px;

    font-size:clamp(20px,5vw,42px);

    line-height:1.7;

    text-shadow:
        0 0 10px #ff477e,
        0 0 25px #ff174f;
}

@keyframes titleAppear{

    from{
        opacity:0;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   MATRIX
========================= */

#matrixCanvas{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:#000;

    z-index:200;
}

#matrixNumber{
    position:fixed;

    z-index:210;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:clamp(130px,35vw,330px);

    font-weight:bold;

    color:white;

    text-shadow:
        0 0 10px white,
        0 0 25px #ff477e,
        0 0 60px #ff174f,
        0 0 100px #8b123f;
}

/* =========================
   القلب الكبير
========================= */

.bigHeart{
    position:absolute;

    left:50%;
    top:50%;

    width:180px;
    height:180px;

    transform:
        translate(-50%,-42%)
        rotate(-45deg);

    background:#9d123f;

    box-shadow:
        0 0 20px #ff174f,
        0 0 50px #ff174f,
        0 0 100px #8b123f;

    animation:bigHeartBeat 1.3s infinite;
}

.bigHeart:before,
.bigHeart:after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    background:#9d123f;

    border-radius:50%;
}

.bigHeart:before{
    top:-90px;
    left:0;
}

.bigHeart:after{
    top:0;
    left:90px;
}

@keyframes bigHeartBeat{

    0%,100%{
        transform:
            translate(-50%,-42%)
            rotate(-45deg)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-42%)
            rotate(-45deg)
            scale(1.1);
    }
}

.heartName{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:30;

    font-size:clamp(30px,8vw,70px);

    font-weight:bold;

    white-space:nowrap;

    text-shadow:
        0 0 10px white,
        0 0 25px #ff174f,
        0 0 50px #ff174f;
}

/* =========================
   الألعاب النارية
========================= */

.firework{
    position:absolute;

    bottom:-30px;

    width:12px;
    height:12px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 10px white,
        0 0 30px #ff174f,
        0 0 60px #ff174f;

    animation:fireworkUp 2s ease-out infinite;
}

@keyframes fireworkUp{

    0%{
        transform:translateY(0) scale(.2);
        opacity:1;
    }

    100%{
        transform:translateY(-70vh) scale(2);
        opacity:0;
    }
}

/* =========================
   قلب كلمات I LOVE YOU
========================= */

.wordHeart{
    position:relative;

    width:min(90vw,650px);
    height:min(80vh,600px);
}

.loveWord{
    position:absolute;

    color:#ffb5c8;

    font-size:clamp(10px,2.2vw,18px);

    font-weight:bold;

    white-space:nowrap;

    text-shadow:
        0 0 5px #ff174f,
        0 0 12px #8b123f;

    transform:translate(-50%,-50%);

    animation:wordGlow 1.5s infinite alternate;
}

@keyframes wordGlow{

    from{
        opacity:.6;
    }

    to{
        opacity:1;
    }
}

/* =========================
   رسالة الاعتذار
========================= */

.apology{
    max-width:900px;

    font-size:clamp(22px,5vw,45px);

    line-height:1.8;

    text-shadow:
        0 0 10px #ff477e,
        0 0 30px #ff174f,
        0 0 50px #8b123f;
}

/* =========================
   تأثير النهاية
========================= */

.finalGlow{
    animation:finalGlow 2s infinite alternate;
}

@keyframes finalGlow{

    from{
        filter:brightness(1);
    }

    to{
        filter:brightness(1.4);
    }
}

/* =========================
   خروج البداية
========================= */

.fadeOut{
    animation:fadeScreen 1.2s forwards;
}

@keyframes fadeScreen{

    to{
        opacity:0;
        visibility:hidden;
    }
}

</style>
</head>

<body>


<!-- ==================================================
     الأغنية
================================================== -->

<audio id="birthdayMusic" loop>
    <source src="happy-birthday.mp3" type="audio/mpeg">
</audio>


<!-- ==================================================
     المشهد 1
================================================== -->

<div id="startScreen" class="screen">

    <div class="moon"></div>

    <div class="startBox">

        <div class="startTitle">
            🎂 ❤️ عيد ميلاد سعيد سمية ❤️ 🎂
        </div>

        <button class="startButton" onclick="startBirthday()">
            اضغطي هنا ❤️
        </button>

    </div>

</div>


<!-- ==================================================
     MATRIX
================================================== -->

<canvas id="matrixCanvas"></canvas>

<div id="matrixNumber">
    3
</div>


<!-- ==================================================
     المشهد 5
================================================== -->

<div id="scene5" class="scene hidden">

    <div class="moon"></div>

    <div class="bigHeart"></div>

    <div class="heartName">
        Soumia ❤️
    </div>

    <div class="firework" style="left:20%;"></div>
    <div class="firework" style="left:50%;animation-delay:.5s;"></div>
    <div class="firework" style="left:80%;animation-delay:1s;"></div>

</div>


<!-- ==================================================
     المشهد 6
================================================== -->

<div id="scene6" class="scene hidden">

    <div class="wordHeart" id="wordHeart"></div>

</div>


<!-- ==================================================
     المشهد 7
================================================== -->

<div id="scene7" class="scene hidden">

    <div class="moon"></div>

    <div class="sceneContent">

        <div class="title">
            Happy Birthday, Soumia ❤️
        </div>

        <div class="subtitle">
            أتمنى أن تظل ابتسامتكِ دائمًا<br>
            أكثر إشراقًا من النجوم ✨❤️
        </div>

    </div>

</div>


<!-- ==================================================
     المشهد 8
================================================== -->

<div id="scene8" class="scene hidden">

    <div class="sceneContent">

        <div class="title">
            I LOVE YOU ❤️
        </div>

    </div>

</div>


<!-- ==================================================
     المشهد 9
================================================== -->

<div id="scene9" class="scene hidden">

    <div class="sceneContent">

        <div class="title">

        </div>

        <div class="subtitle apology">

        </div>

    </div>

</div>


<!-- ==================================================
     المشهد 10
================================================== -->

<div id="scene10" class="scene hidden">

    <div class="sceneContent">

        <div class="title">
            أنتِ مميزة ❤️
        </div>

    </div>

</div>


<!-- ==================================================
     المشهد 11
================================================== -->

<div id="scene11" class="scene hidden">

    <div class="moon"></div>

    <div class="sceneContent finalGlow">

        <div class="title">
            Happy Birthday, Soumia ❤️
        </div>

        <div class="subtitle">
            15 October 2010 🎂
        </div>

    </div>

</div>


<script>

/* ==================================================
   المتغيرات
================================================== */

const music = document.getElementById("birthdayMusic");

const startScreen = document.getElementById("startScreen");

const canvas = document.getElementById("matrixCanvas");

const ctx = canvas.getContext("2d");

const matrixNumber = document.getElementById("matrixNumber");

let matrixAnimation;

let matrixRunning = false;


/* ==================================================
   حجم شاشة Matrix
================================================== */

function resizeCanvas(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);


/* ==================================================
   Matrix
================================================== */

const matrixCharacters =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789LOVE❤️★☆♥♡";

let fontSize = 17;

let columns = 0;

let drops = [];


function resetMatrix(){

    columns = Math.floor(canvas.width / fontSize);

    drops = [];

    for(let i=0;i<columns;i++){

        drops[i] =
            Math.floor(
                Math.random() * -canvas.height / fontSize
            );

    }

}


function drawMatrix(){

    if(!matrixRunning){
        return;
    }

    ctx.fillStyle = "rgba(0,0,0,0.12)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font =
        fontSize +
        "px Arial";

    for(let i=0;i<drops.length;i++){

        const char =
            matrixCharacters[
                Math.floor(
                    Math.random() *
                    matrixCharacters.length
                )
            ];

        const x =
            i * fontSize;

        const y =
            drops[i] * fontSize;

        const random =
            Math.random();

        if(random < .25){

            ctx.fillStyle = "#ff174f";

        }else if(random < .5){

            ctx.fillStyle = "#ff8fab";

        }else{

            ctx.fillStyle = "#ffffff";

        }

        ctx.fillText(
            char,
            x,
            y
        );

        if(
            y > canvas.height &&
            Math.random() > .975
        ){

            drops[i] = 0;

        }

        drops[i]++;
    }

    matrixAnimation =
        requestAnimationFrame(drawMatrix);
}


function startMatrix(){

    matrixRunning = true;

    canvas.classList.remove("hidden");

    resetMatrix();

    cancelAnimationFrame(matrixAnimation);

    drawMatrix();
}


function stopMatrix(){

    matrixRunning = false;

    cancelAnimationFrame(matrixAnimation);

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.classList.add("hidden");

}


/* ==================================================
   تغيير رقم العد التنازلي
================================================== */

function showNumber(number){

    matrixNumber.textContent = number;

}


/* ==================================================
   إخفاء جميع المشاهد
================================================== */

function hideAllScenes(){

    document
        .querySelectorAll(".scene")
        .forEach(scene => {

            scene.classList.add("hidden");

        });

}


/* ==================================================
   إظهار مشهد
================================================== */

function showScene(id){

    hideAllScenes();

    const scene =
        document.getElementById(id);

    if(scene){

        scene.classList.remove("hidden");

        addDecorations(scene);

    }

}


/* ==================================================
   إنشاء النجوم والقلوب والورود
================================================== */

function addDecorations(scene){

    if(scene.dataset.decorated === "true"){
        return;
    }

    scene.dataset.decorated = "true";


    /* النجوم */

    for(let i=0;i<60;i++){

        const star =
            document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random()*100 + "%";

        star.style.top =
            Math.random()*100 + "%";

        star.style.animationDelay =
            Math.random()*2 + "s";

        scene.appendChild(star);

    }


    /* الورود */

    for(let i=0;i<12;i++){

        const rose =
            document.createElement("div");

        rose.className = "rose";

        rose.textContent = "🌹";

        rose.style.left =
            Math.random()*94 + "%";

        rose.style.top =
            Math.random()*90 + "%";

        rose.style.animationDelay =
            Math.random()*3 + "s";

        scene.appendChild(rose);

    }


    /* القلوب */

    for(let i=0;i<18;i++){

        const heart =
            document.createElement("div");

        heart.className =
            "floatingHeart";

        heart.textContent =
            Math.random() > .5
            ? "❤️"
            : "💗";

        heart.style.left =
            Math.random()*100 + "%";

        heart.style.animationDuration =
            (4 + Math.random()*5) + "s";

        heart.style.animationDelay =
            Math.random()*5 + "s";

        scene.appendChild(heart);

    }

}


/* ==================================================
   إنشاء قلب من I LOVE YOU
================================================== */

function createWordHeart(){

    const container =
        document.getElementById("wordHeart");

    container.innerHTML = "";

    const width =
        container.clientWidth;

    const height =
        container.clientHeight;


    /*
       معادلة القلب
    */

    for(let t=0;t<Math.PI*2;t+=0.045){

        const x =
            16 *
            Math.pow(Math.sin(t),3);

        const y =
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t);

        const love =
            document.createElement("span");

        love.className =
            "loveWord";

        love.textContent =
            "I LOVE YOU ❤️";

        love.style.left =
            (width/2 + x*width/38) + "px";

        love.style.top =
            (height/2 - y*height/32) + "px";

        love.style.animationDelay =
            Math.random()*2 + "s";

        container.appendChild(love);

    }


    /*
       ملء داخل القلب
    */

    for(let i=0;i<110;i++){

        const angle =
            Math.random()*Math.PI*2;

        const radius =
            Math.sqrt(Math.random());

        const x =
            Math.sin(angle) *
            radius *
            width*.34;

        const y =
            Math.cos(angle) *
            radius *
            height*.30;

        const love =
            document.createElement("span");

        love.className =
            "loveWord";

        love.textContent =
            Math.random() > .5
            ? "I LOVE YOU"
            : "❤️";

        love.style.left =
            width/2 + x + "px";

        love.style.top =
            height/2 - y + "px";

        container.appendChild(love);

    }

}


/* ==================================================
   بداية المفاجأة
================================================== */

function startBirthday(){

    /*
       تشغيل الأغنية بعد الضغط
       حتى يسمح المتصفح بتشغيلها
    */

    music.currentTime = 0;

    music.play().catch(function(){

        console.log(
            "لم يتم تشغيل الأغنية."
        );

    });


    /*
       إخفاء زر البداية
    */

    startScreen.classList.add("fadeOut");


    /*
       Matrix
    */

    setTimeout(function(){

        startScreen.classList.add("hidden");

        startMatrix();

        matrixNumber.classList.remove("hidden");

        showNumber(3);

    },1200);


    /*
       الرقم 2
    */

    setTimeout(function(){

        showNumber(2);

    },3200);


    /*
       الرقم 1
    */

    setTimeout(function(){

        showNumber(1
